[build]
builder = "nixpacks"
buildCommand = "apt-get update && apt-get install -y python3-pip && python3 -m pip install --upgrade pip && cd backend && python3 -m pip install -r requirements.txt"

[deploy]
startCommand = "cd backend && gunicorn app:create_app()"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[deploy.env]
FLASK_ENV = "production"
PYTHON_UNBUFFERED = "1"
PYTHON_VERSION = "3.9" 
