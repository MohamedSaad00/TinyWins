[build]
builder = "nixpacks"
buildCommand = "apt-get update && apt-get install -y python3-pip && python3 -m pip install --upgrade pip && cd backend && python3 -m pip install -r requirements.txt"

[deploy]
startCommand = "cd backend && gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --access-logfile - --error-logfile - app:create_app()"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[deploy.env]
FLASK_ENV = "production"
PYTHON_UNBUFFERED = "1"
PYTHON_VERSION = "3.9"
FLASK_APP = "app.py"
DATABASE_URL = postgresql://postgres:bGGNbnYSilpHPlluuoUhTwnKoLtNXRil@metro.proxy.rlwy.net:55187/railway
