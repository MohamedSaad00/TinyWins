[build]
builder = "nixpacks"
buildCommand = "apt-get update && apt-get install -y python3.10 python3.10-dev python3-pip build-essential && ln -sf /usr/bin/python3.10 /usr/bin/python && ln -sf /usr/bin/pip3 /usr/bin/pip && python -m pip install --upgrade pip && pip install -r requirements.txt"

[deploy]
startCommand = "export PATH=/usr/local/bin:/usr/bin:/bin:$PATH && export PYTHONPATH=/app:$PYTHONPATH && chmod +x start.sh && ./start.sh"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[deploy.env]
PYTHON_VERSION = "3.10"
FLASK_ENV = "production"
PYTHONPATH = "/app"
PATH = "/usr/local/bin:/usr/bin:/bin"
